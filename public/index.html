<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #020617;
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #1e293b;
    }

    .login-box h2 {
      margin-bottom: 25px;
      color: #3b82f6;
    }

    .login-box input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #1e293b;
      border-radius: 6px;
      background: #0f172a;
      color: white;
      outline: none;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-color: #3b82f6;
    }

    .login-box button {
      width: 98%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: #2563eb;
    }

    .login-box button:disabled {
      background: #1e3a5f;
      cursor: not-allowed;
    }

    .login-box p {
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .login-box a {
      color: #3b82f6;
      text-decoration: none;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    .error-msg {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .success-msg {
      background: #14532d;
      color: #4ade80;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="login-box">
      <h2>Sign In</h2>
      <input type="email" placeholder="Enter Email" id="email">
      <input type="password" placeholder="Enter Password" id="password">
      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>
      <button onclick="login()" id="login-btn">Login</button>
      <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = document.getElementById("login-btn");
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      if (!email || !password) {
        errorMsg.textContent = "Login details are missing!";
        errorMsg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";


      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem("loggedInEmail", data.email);
          successMsg.textContent = "Login successful!";
          successMsg.style.display = "block";
          setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
        } else {
          errorMsg.textContent = data.message || "Email or password is incorrect!";
          errorMsg.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Login";
        }
      } catch (error) {
        errorMsg.textContent = "Cannot connect to server!";
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
      }
    }

    document.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  </script>
</body>

</html>
