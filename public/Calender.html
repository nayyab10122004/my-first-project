<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Calendar Tasks</title>
    <style>
        body {
            background: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .calendar-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #3b82f6;
            margin-bottom: 10px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 5px;
        }

        .calendar-days div {
            padding: 15px 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            font-size: 14px;
        }

        .calendar-days div:hover {
            background: #334155;
        }

        .today {
            background: #3b82f6 !important;
            color: white;
            font-weight: bold;
        }

        /* Task Indicator Dot */
        .has-task::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #10b981;
            border-radius: 50%;
        }

        .empty-day {
            cursor: default !important;
        }
    </style>
</head>

<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <button onclick="prevMonth()">❮</button>
            <h2 id="monthDisplay">Month Year</h2>
            <button onclick="nextMonth()">❯</button>
        </div>
        <div class="calendar-weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <div id="calendarDays" class="calendar-days"></div>
    </div>

    <script>
        let date = new Date();

        function renderCalendar() {
            date.setDate(1);
            const monthDays = document.getElementById("calendarDays");
            const monthDisplay = document.getElementById("monthDisplay");

            const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const firstDayIndex = date.getDay();

            const months = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];

            monthDisplay.innerText = `${months[date.getMonth()]} ${date.getFullYear()}`;

            let days = "";

            // Previous month spaces
            for (let x = firstDayIndex; x > 0; x--) {
                days += `<div class="empty-day"></div>`;
            }

            // Tasks load karein localStorage se
            const savedTasks = JSON.parse(localStorage.getItem("calendarTasks")) || {};

            // Current month days
            for (let i = 1; i <= lastDay; i++) {
                const dateStr = `${date.getFullYear()}-${date.getMonth() + 1}-${i}`;
                let className = "";

                // Check if it's today
                if (i === new Date().getDate() && date.getMonth() === new Date().getMonth() && date.getFullYear() === new Date().getFullYear()) {
                    className += "today ";
                }

                // Check if this date has a task
                if (savedTasks[dateStr]) {
                    className += "has-task ";
                }

                days += `<div class="${className}" onclick="handleDateClick(${i})">${i}</div>`;
            }

            monthDays.innerHTML = days;
        }

        // Function to handle clicking on a date
        function handleDateClick(day) {
            const dateStr = `${date.getFullYear()}-${date.getMonth() + 1}-${day}`;
            const savedTasks = JSON.parse(localStorage.getItem("calendarTasks")) || {};

            let existingTask = savedTasks[dateStr] || "No task";
            let newTask = prompt(`Tasks for ${dateStr}:\nCurrent: ${existingTask}\n\nEnter new task (or leave empty to delete):`);

            if (newTask === null) return; // Cancel press kiya

            if (newTask.trim() === "") {
                delete savedTasks[dateStr];
            } else {
                savedTasks[dateStr] = newTask;
            }

            localStorage.setItem("calendarTasks", JSON.stringify(savedTasks));
            renderCalendar();
        }

        function prevMonth() {
            date.setMonth(date.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            date.setMonth(date.getMonth() + 1);
            renderCalendar();
        }

        renderCalendar();
    </script>

</body>

</html>
