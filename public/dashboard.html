<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      display: flex;
    }

    .nav {
      background: #02071b;
      padding: 15px;
      display: flex;
      gap: 20px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      font-size: 17px;
      cursor: pointer;
    }

    .nav a:hover {
      color: #94a3b8;
    }

    .sidebar {
      width: 200px;
      background: #020617;
      height: 100vh;
      padding: 20px;
      position: sticky;
      top: 0;
    }

    .sidebar h2 {
      color: #3b82f6;
    }

    .sidebar ul {
      padding: 0;
      list-style: none;
    }

    .sidebar li {
      margin: 10px 0;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }

    .sidebar li a {
      color: white;
      text-decoration: none;
    }

    .sidebar li:hover,
    .sidebar .active {
      background: #1e293b;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .add-task {
      margin-bottom: 20px;
    }

    .add-task input {
      padding: 10px;
      width: 250px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    .add-task button {
      padding: 10px 20px;
      margin-left: 10px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .add-task button:hover {
      background: #2563eb;
    }

    #taskList {
      padding: 0;
      list-style: none;
    }

    #taskList li {
      background: #1e293b;
      margin: 10px 0;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #taskList button {
      background: #ef4444;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    #taskList button:hover {
      background: #dc2626;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="sidebar">
      <h2>🎓 Student</h2>
      <ul>
        <li class="active"><a href="#">Dashboard</a></li>
        <li><a href="mytask.html">My Tasks</a></li>
        <li><a href="sigh.in.html">Sign In</a></li>
        <li><a href="Calender.html">Calender</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li onclick="logout()"><a href="#">Logout</a></li>
      </ul>
    </div>

    <div class="main">
      <h1 id="welcome">Loading...</h1>

      <div class="add-task">
        <input type="text" id="taskInput" placeholder="Enter task...">
        <button onclick="addTask()">Add Task</button>
      </div>

      <ul id="taskList"></ul>
    </div>

  </div>

  <script>
    window.onload = async function () {
      const email = localStorage.getItem("student");

      if (!email) {
        alert("No user found, please login.");
        document.getElementById("welcome").innerText = "Welcome, Guest!";
        return;
      }

      document.getElementById("welcome").innerText = "Welcome, " + email;
      loadTasks();
    };

    async function addTask() {
      const taskInput = document.getElementById("taskInput");
      const task = taskInput.value;
      const email = localStorage.getItem("student");

      if (!task) return alert("Kuch toh likho!");

      try {
        await fetch("/addTask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, task })
        });

        taskInput.value = "";
        loadTasks();
      } catch (err) {
        console.error("Server error:", err);
        alert("Task add nahi ho saka. Kya server ON hai?");
      }
    }

    async function loadTasks() {
      const email = localStorage.getItem("student");
      const list = document.getElementById("taskList");

      try {
        const res = await fetch(`/tasks/${email}`);
        const tasks = await res.json();

        list.innerHTML = "";
        tasks.forEach(t => {
          list.innerHTML += `
          <li>
            ${t.task}
            <button onclick="deleteTask('${t._id}')">Delete</button>
          </li>
        `;
        });
      } catch (err) {
        list.innerHTML = "<p style='color: #94a3b8;'>Server se data nahi aa raha...</p>";
      }
    }

    async function deleteTask(id) {
      try {
        await fetch(`/deleteTask/${id}`, { method: "DELETE" });
        loadTasks();
      } catch (err) {
        alert("Delete nahi ho saka.");
      }
    }

    function logout() {
      localStorage.removeItem("student");
      alert("Logging out...");
    }
  </script>

</body>

</html>
