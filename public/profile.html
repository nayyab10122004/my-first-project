<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Profile</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      display: flex;
    }

    .sidebar {
      width: 200px;
      background: #020617;
      height: 100vh;
      padding: 20px;
      position: sticky;
      top: 0;
    }

    .sidebar h2 {
      color: #3b82f6;
    }

    .sidebar ul {
      padding: 0;
      list-style: none;
    }

    .sidebar li {
      margin: 10px 0;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }

    .sidebar li a {
      color: white;
      text-decoration: none;
      display: block;
    }

    .sidebar li:hover,
    .sidebar .active {
      background: #1e293b;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .profile-card {
      background: #1e293b;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      text-align: center;
      margin-top: 20px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 20px auto;
      border: 3px solid #3b82f6;
    }

    .profile-card input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      background: #0f172a;
      color: white;
      outline: none;
    }

    .profile-card input:focus {
      border: 1px solid #3b82f6;
    }

    .profile-card input:disabled {
      color: #94a3b8;
      cursor: not-allowed;
    }

    .profile-card button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: 0.3s;
    }

    .profile-card button:hover {
      background: #2563eb;
    }

    .profile-card button:disabled {
      background: #1e3a5f;
      cursor: not-allowed;
    }

    .error-msg {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .success-msg {
      background: #14532d;
      color: #4ade80;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <h2>Task Managment App</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="mytask.html">My Tasks</a></li>
        <li><a href="Calender.html">Calendar</a></li>
        <li class="active"><a href="profile.html">Profile</a></li>
        <li onclick="logout()"><a href="#" style="color:#ef4444;">Logout</a></li>
      </ul>
    </div>
    <div class="main">
      <h1>My Profile</h1>
      <div class="profile-card">
        <div class="avatar" id="avatar">?</div>
        <input type="email" id="emailDisplay" placeholder="Email" disabled>
        <input type="text" id="name" placeholder="Enter Full Name">
        <input type="text" id="course" placeholder="Enter Course">
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>
        <button onclick="saveProfile()" id="save-btn">Save Profile</button>
      </div>
    </div>
  </div>

  <script>
    const email = localStorage.getItem("loggedInEmail");

    window.onload = async function () {
      if (!email) {
        alert("Please login first!");
        window.location.href = "index.html";
        return;
      }

      document.getElementById("emailDisplay").value = email;

      try {
        const res = await fetch(`/profile/${email}`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById("name").value = data.name || "";
          document.getElementById("course").value = data.course || "";
          if (data.name) document.getElementById("avatar").textContent = data.name.charAt(0).toUpperCase();
        }
      } catch (err) {
        console.error("Profile not loading:", err);
      }
    };

    async function saveProfile() {
      const name = document.getElementById("name").value.trim();
      const course = document.getElementById("course").value.trim();
      const btn = document.getElementById("save-btn");
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      if (!name) { errorMsg.textContent = "Name is required!"; errorMsg.style.display = "block"; return; }

      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        const res = await fetch("/profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, name, course })
        });

        if (res.ok) {
          successMsg.textContent = "Profile saved successfully!";
          successMsg.style.display = "block";
          document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
        } else {
          errorMsg.textContent = "Profile not saved!";
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.textContent = "Server is not running!";
        errorMsg.style.display = "block";
      }

      btn.disabled = false;
      btn.textContent = "Save Profile";
    }

    function logout() {
      localStorage.removeItem("loggedInEmail");
      window.location.href = "index.html";
    }
  </script>
</body>

</html>
