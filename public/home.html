<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Home Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      display: flex;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: #020617;
      padding: 20px;
      position: sticky;
      top: 0;
    }

    .sidebar h2 {
      color: #3b82f6;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: 10px;
      margin: 5px 0;
      cursor: pointer;
      border-radius: 6px;
    }

    .sidebar li a {
      color: white;
      text-decoration: none;
      display: block;
    }

    .sidebar li:hover,
    .sidebar .active {
      background: #1e293b;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      flex: 1;
      text-align: center;
    }

    .card h3 {
      margin-top: 0;
      color: #94a3b8;
    }

    .card p {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 0;
    }

    .table {
      margin-top: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      padding: 15px;
      margin-bottom: 10px;
      background: #1e293b;
      border-radius: 10px;
      align-items: center;
    }

    .header {
      background: transparent;
      font-weight: bold;
      color: #94a3b8;
    }

    .done {
      background: #16a34a;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
    }

    .progress {
      background: #ea580c;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
    }

    .pending {
      background: #dc2626;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="sidebar">
      <h2>TaskApp</h2>
      <ul>
        <li class="active"><a href="#">Dashboard</a></li>
        <li><a href="#">My Tasks</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Settings</a></li>
        <li onclick="logout()" style="color: #ef4444; font-weight: bold; margin-top: 20px;">Logout</li>
      </ul>
    </div>

    <div class="main">
      <h1 id="welcome">Welcome back!</h1>

      <div class="cards">
        <div class="card">
          <h3>Total Tasks</h3>
          <p id="totalCount">0</p>
        </div>

        <div class="card">
          <h3>Completed</h3>
          <p>0</p>
        </div>

        <div class="card">
          <h3>In Progress</h3>
          <p>0</p>
        </div>
      </div>

      <div class="table">
        <h2>Recent Tasks</h2>

        <div class="row header">
          <div>Task Name</div>
          <div>Action</div>
        </div>

        <div id="taskList"></div>
      </div>
    </div>

  </div>

  <script>
    window.onload = function () {
      const student = localStorage.getItem("student");

      if (!student) {
        alert("Please login first!");
        window.location.href = "login.html";
        return;
      }

      document.getElementById("welcome").innerText = "Welcome back, " + student + "!";
      loadTasks();
    };

    function loadTasks() {
      const taskList = document.getElementById("taskList");
      const totalCount = document.getElementById("totalCount");

      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      totalCount.innerText = tasks.length;

      taskList.innerHTML = "";

      tasks.forEach((t, index) => {
        taskList.innerHTML += `
          <div class="row">
            <div>${t}</div>
            <div>
              <span class="progress">Active</span>
              <button class="delete-btn" onclick="deleteTask(${index})">❌</button>
            </div>
          </div>
        `;
      });

      if (tasks.length === 0) {
        taskList.innerHTML = "<p style='color: #64748b;'>No tasks found. Add some from the My Tasks page!</p>";
      }
    }

    function deleteTask(index) {
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      tasks.splice(index, 1);
      localStorage.setItem("tasks", JSON.stringify(tasks));
      loadTasks();
    }

    function logout() {
      localStorage.removeItem("student");
      alert("Logged out successfully!");
      window.location.href = "login.html";
    }
  </script>

</body>

</html>
